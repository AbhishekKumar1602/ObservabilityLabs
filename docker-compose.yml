name: ${COMPOSE_PROJECT_NAME:-fastapi-observability}
services:
  init-volumes:
    image: ${COMPOSE_PROJECT_NAME:-fastapi-observability}-app:local
    build:
      context: ./app
      target: runtime
    user: 0:0
    network_mode: none
    read_only: true
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    cap_add:
    - CHOWN
    - DAC_OVERRIDE
    - FOWNER
    restart: 'no'
    entrypoint:
    - python
    - -c
    command:
    - "import os\nfor name in ('postgres','redis','prometheus','alertmanager','grafana','loki','tempo','otel','pyroscope'):\n\
      \    path = '/vol/' + name\n    uid = 999 if name == 'postgres' else 10001\n    os.chown(path, uid, uid)\n    os.chmod(path,\
      \ 0o700 if name == 'postgres' else 0o750)\n"
    healthcheck:
      disable: true
    volumes:
    - type: volume
      source: postgres-data
      target: /vol/postgres
      volume:
        nocopy: true
    - type: volume
      source: redis-data
      target: /vol/redis
      volume:
        nocopy: true
    - type: volume
      source: prometheus-data
      target: /vol/prometheus
      volume:
        nocopy: true
    - type: volume
      source: alertmanager-data
      target: /vol/alertmanager
      volume:
        nocopy: true
    - type: volume
      source: grafana-data
      target: /vol/grafana
      volume:
        nocopy: true
    - type: volume
      source: loki-data
      target: /vol/loki
      volume:
        nocopy: true
    - type: volume
      source: tempo-data
      target: /vol/tempo
      volume:
        nocopy: true
    - type: volume
      source: otel-data
      target: /vol/otel
      volume:
        nocopy: true
    - type: volume
      source: pyroscope-data
      target: /vol/pyroscope
      volume:
        nocopy: true
  postgres:
    restart: unless-stopped
    networks:
    - platform
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    image: postgres:17.11-bookworm
    user: 999:999
    mem_limit: 512m
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_ADMIN_PASSWORD in .env}
      APP_DB_USER: ${POSTGRES_USER:-items_app}
      APP_DB_PASSWORD: ${POSTGRES_PASSWORD}
      APP_DB_NAME: ${POSTGRES_DB:-items}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    depends_on:
      init-volumes:
        condition: service_completed_successfully
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -h 127.0.0.1 -U postgres -d postgres
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    volumes:
    - type: volume
      source: postgres-data
      target: /var/lib/postgresql/data
      volume:
        nocopy: true
    - ./postgres/init.sql:/docker-entrypoint-initdb.d/001-bootstrap.sql:ro
    tmpfs:
    - /var/run/postgresql:uid=999,gid=999,mode=0770
    - /tmp
  redis:
    restart: unless-stopped
    networks:
    - platform
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    image: redis:7.4.8-bookworm
    user: 10001:10001
    read_only: true
    mem_limit: 128m
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command:
    - sh
    - -ec
    - exec redis-server --appendonly yes --maxmemory 64mb --maxmemory-policy allkeys-lru --requirepass "$$REDIS_PASSWORD"
    depends_on:
      init-volumes:
        condition: service_completed_successfully
    healthcheck:
      test:
      - CMD-SHELL
      - REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    volumes:
    - type: volume
      source: redis-data
      target: /data
      volume:
        nocopy: true
    tmpfs:
    - /tmp
  migrate:
    restart: 'no'
    networks:
    - platform
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    image: ${COMPOSE_PROJECT_NAME:-fastapi-observability}-app:local
    build:
      context: ./app
      target: runtime
    environment:
      APP_NAME: ${APP_NAME:-FastAPI Observability}
      APP_VERSION: ${APP_VERSION:-1.0.0}
      ENVIRONMENT: ${ENVIRONMENT:-local}
      SERVICE_NAME: ${SERVICE_NAME:-fastapi-items}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-items}
      POSTGRES_USER: ${POSTGRES_USER:-items_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
      REDIS_TIMEOUT_SECONDS: ${REDIS_TIMEOUT_SECONDS:-0.25}
      REDIS_POOL_SIZE: ${REDIS_POOL_SIZE:-10}
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-30}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-5}
      DB_TIMEOUT_SECONDS: ${DB_TIMEOUT_SECONDS:-3}
      DEPENDENCY_PROBE_INTERVAL_SECONDS: ${DEPENDENCY_PROBE_INTERVAL_SECONDS:-15}
      STARTUP_ATTEMPTS: ${STARTUP_ATTEMPTS:-5}
      REQUEST_ID_HEADER: ${REQUEST_ID_HEADER:-X-Request-ID}
      METRICS_ENABLED: ${METRICS_ENABLED:-true}
      OTEL_ENABLED: 'false'
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
      TRACE_SAMPLE_RATIO: ${TRACE_SAMPLE_RATIO:-1.0}
      PYROSCOPE_ENABLED: 'false'
      PYROSCOPE_SERVER_ADDRESS: ${PYROSCOPE_SERVER_ADDRESS:-http://pyroscope:4040}
      PYROSCOPE_SAMPLE_RATE: ${PYROSCOPE_SAMPLE_RATE:-100}
      DEMO_ENABLED: ${DEMO_ENABLED:-false}
    command:
    - alembic
    - upgrade
    - head
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      disable: true
    read_only: true
    tmpfs:
    - /tmp
  app:
    restart: unless-stopped
    networks:
    - platform
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    logging:
      driver: fluentd
      options:
        fluentd-address: 127.0.0.1:8006
        fluentd-async: 'true'
        fluentd-buffer-limit: '8192'
        tag: fastapi.app
        mode: non-blocking
        max-buffer-size: 4m
        cache-max-size: 10m
        cache-max-file: '3'
    image: ${COMPOSE_PROJECT_NAME:-fastapi-observability}-app:local
    build:
      context: ./app
      target: runtime
    environment:
      APP_NAME: ${APP_NAME:-FastAPI Observability}
      APP_VERSION: ${APP_VERSION:-1.0.0}
      ENVIRONMENT: ${ENVIRONMENT:-local}
      SERVICE_NAME: ${SERVICE_NAME:-fastapi-items}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-items}
      POSTGRES_USER: ${POSTGRES_USER:-items_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
      REDIS_TIMEOUT_SECONDS: ${REDIS_TIMEOUT_SECONDS:-0.25}
      REDIS_POOL_SIZE: ${REDIS_POOL_SIZE:-10}
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-30}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-5}
      DB_TIMEOUT_SECONDS: ${DB_TIMEOUT_SECONDS:-3}
      DEPENDENCY_PROBE_INTERVAL_SECONDS: ${DEPENDENCY_PROBE_INTERVAL_SECONDS:-15}
      STARTUP_ATTEMPTS: ${STARTUP_ATTEMPTS:-5}
      REQUEST_ID_HEADER: ${REQUEST_ID_HEADER:-X-Request-ID}
      METRICS_ENABLED: ${METRICS_ENABLED:-true}
      OTEL_ENABLED: ${OTEL_ENABLED:-true}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
      TRACE_SAMPLE_RATIO: ${TRACE_SAMPLE_RATIO:-1.0}
      PYROSCOPE_ENABLED: ${PYROSCOPE_ENABLED:-true}
      PYROSCOPE_SERVER_ADDRESS: ${PYROSCOPE_SERVER_ADDRESS:-http://pyroscope:4040}
      PYROSCOPE_SAMPLE_RATE: ${PYROSCOPE_SAMPLE_RATE:-100}
      DEMO_ENABLED: ${DEMO_ENABLED:-false}
    read_only: true
    mem_limit: 384m
    stop_grace_period: 40s
    init: true
    ports:
    - 127.0.0.1:8000:8000
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
      otel-collector:
        condition: service_started
    tmpfs:
    - /tmp
  otel-collector:
    restart: unless-stopped
    networks:
    - platform
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    image: ${COMPOSE_PROJECT_NAME:-fastapi-observability}-otel:local
    build:
      context: ./config/health
      args:
        BASE_IMAGE: otel/opentelemetry-collector-contrib:0.160.0
    read_only: true
    mem_limit: 256m
    command:
    - --config=/etc/otelcol-contrib/config.yaml
    depends_on:
      init-volumes:
        condition: service_completed_successfully
    volumes:
    - ./config/otel/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    - type: volume
      source: otel-data
      target: /var/lib/otelcol
      volume:
        nocopy: true
    healthcheck:
      test:
      - CMD
      - /usr/local/bin/busybox
      - wget
      - -q
      - -O
      - /dev/null
      - http://127.0.0.1:13133/
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    tmpfs:
    - /tmp
    environment:
      SERVICE_NAME: ${SERVICE_NAME:-fastapi-items}
      ENVIRONMENT: ${ENVIRONMENT:-local}
    ports:
    - 127.0.0.1:8006:8006
  loki:
    restart: unless-stopped
    networks:
    - platform
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    image: ${COMPOSE_PROJECT_NAME:-fastapi-observability}-loki:local
    build:
      context: ./config/health
      args:
        BASE_IMAGE: grafana/loki:3.7.7
    read_only: true
    mem_limit: 512m
    command:
    - -config.file=/etc/loki/config.yaml
    depends_on:
      init-volumes:
        condition: service_completed_successfully
    volumes:
    - ./config/loki/loki-config.yaml:/etc/loki/config.yaml:ro
    - type: volume
      source: loki-data
      target: /loki
      volume:
        nocopy: true
    healthcheck:
      test:
      - CMD
      - /usr/local/bin/busybox
      - wget
      - -q
      - -O
      - /dev/null
      - http://127.0.0.1:3100/ready
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    tmpfs:
    - /tmp
  tempo:
    restart: unless-stopped
    networks:
    - platform
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    image: ${COMPOSE_PROJECT_NAME:-fastapi-observability}-tempo:local
    build:
      context: ./config/health
      args:
        BASE_IMAGE: grafana/tempo:3.0.3
    read_only: true
    mem_limit: 768m
    command:
    - -config.file=/etc/tempo/tempo.yaml
    - -backend-scheduler.provider.work.compaction.block-retention=72h
    - -backend-worker.compaction.block-retention=72h
    depends_on:
      init-volumes:
        condition: service_completed_successfully
    volumes:
    - ./config/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
    - type: volume
      source: tempo-data
      target: /var/tempo
      volume:
        nocopy: true
    healthcheck:
      test:
      - CMD
      - /usr/local/bin/busybox
      - wget
      - -q
      - -O
      - /dev/null
      - http://127.0.0.1:3200/ready
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    tmpfs:
    - /tmp
  pyroscope:
    restart: unless-stopped
    networks:
    - platform
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    image: ${COMPOSE_PROJECT_NAME:-fastapi-observability}-pyroscope:local
    build:
      context: ./config/health
      args:
        BASE_IMAGE: grafana/pyroscope:2.3.1
    read_only: true
    mem_limit: 768m
    command:
    - -config.file=/etc/pyroscope/config.yaml
    - -retention-period=72h
    depends_on:
      init-volumes:
        condition: service_completed_successfully
    volumes:
    - ./config/pyroscope/pyroscope.yml:/etc/pyroscope/config.yaml:ro
    - type: volume
      source: pyroscope-data
      target: /data
      volume:
        nocopy: true
    healthcheck:
      test:
      - CMD
      - /usr/local/bin/busybox
      - wget
      - -q
      - -O
      - /dev/null
      - http://127.0.0.1:4040/ready
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    tmpfs:
    - /tmp
    working_dir: /data
    ports:
    - 127.0.0.1:4040:4040
  prometheus:
    restart: unless-stopped
    networks:
    - platform
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    image: prom/prometheus:v3.14.0
    user: 10001:10001
    read_only: true
    mem_limit: 384m
    command:
    - --config.file=/etc/prometheus/prometheus.yml
    - --storage.tsdb.path=/prometheus
    - --storage.tsdb.retention.time=3d
    - --storage.tsdb.retention.size=1GB
    ports:
    - 127.0.0.1:9090:9090
    volumes:
    - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    - ./config/prometheus/rules:/etc/prometheus/rules:ro
    - type: volume
      source: prometheus-data
      target: /prometheus
      volume:
        nocopy: true
    depends_on:
      init-volumes:
        condition: service_completed_successfully
    healthcheck:
      test:
      - CMD
      - /bin/wget
      - -q
      - -O
      - /dev/null
      - http://127.0.0.1:9090/-/ready
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    tmpfs:
    - /tmp
  alertmanager:
    restart: unless-stopped
    networks:
    - platform
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    image: prom/alertmanager:v0.34.0
    user: 10001:10001
    read_only: true
    mem_limit: 128m
    command:
    - --config.file=/etc/alertmanager/alertmanager.yml
    - --storage.path=/alertmanager
    - --cluster.listen-address=
    ports:
    - 127.0.0.1:9093:9093
    volumes:
    - ./config/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    - ./config/alertmanager/templates:/etc/alertmanager/templates:ro
    - type: volume
      source: alertmanager-data
      target: /alertmanager
      volume:
        nocopy: true
    depends_on:
      init-volumes:
        condition: service_completed_successfully
    healthcheck:
      test:
      - CMD
      - /bin/wget
      - -q
      - -O
      - /dev/null
      - http://127.0.0.1:9093/-/ready
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    tmpfs:
    - /tmp
  grafana:
    restart: unless-stopped
    networks:
    - platform
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    image: grafana/grafana:13.2.2
    user: 10001:10001
    read_only: true
    mem_limit: 512m
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      GF_LOG_MODE: console
      GF_PATHS_LOGS: /var/lib/grafana/log
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
      GF_PLUGINS_PREINSTALL_DISABLED: 'true'
    ports:
    - 127.0.0.1:3000:3000
    depends_on:
      init-volumes:
        condition: service_completed_successfully
    volumes:
    - type: volume
      source: grafana-data
      target: /var/lib/grafana
      volume:
        nocopy: true
    - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
    - ./config/grafana/dashboards:/var/lib/grafana/dashboards:ro
    healthcheck:
      test:
      - CMD
      - wget
      - -q
      - -O
      - /dev/null
      - http://127.0.0.1:3000/api/health
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    tmpfs:
    - /tmp
networks:
  platform:
    driver: bridge
volumes:
  postgres-data: null
  redis-data: null
  prometheus-data: null
  alertmanager-data: null
  grafana-data: null
  loki-data: null
  tempo-data: null
  otel-data: null
  pyroscope-data: null

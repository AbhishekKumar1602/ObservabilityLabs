extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  file_storage:
    directory: /var/lib/otelcol/queue
    create_directory: true
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
  # Docker's built-in fluentd driver; no separate Fluentd server.
  fluent_forward:
    endpoint: 0.0.0.0:8006
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 192
    spike_limit_mib: 48
  resource/logs:
    attributes:
      - key: service.name
        value: ${env:SERVICE_NAME}
        action: upsert
      - key: deployment.environment.name
        value: ${env:ENVIRONMENT}
        action: upsert
  transform/logs:
    error_mode: ignore
    log_statements:
      - context: log
        statements:
          # Preserve JSON body for derived fields; add native OTLP context too.
          - merge_maps(log.cache, ParseJSON(log.body), "upsert") where IsString(log.body) and IsMatch(log.body, "^\\{")
          - set(log.severity_text, log.cache["level"]) where log.cache["level"] != nil
          - set(log.attributes["request_id"], log.cache["request_id"]) where log.cache["request_id"] != nil
          - set(log.trace_id.string, log.cache["trace_id"]) where log.cache["trace_id"] != nil
          - set(log.span_id.string, log.cache["span_id"]) where log.cache["span_id"] != nil
  transform/traces:
    error_mode: ignore
    trace_statements:
      - context: span
        statements:
          - delete_key(span.attributes, "db.statement")
          - delete_key(span.attributes, "db.query.text")
          - delete_key(span.attributes, "http.url")
          - delete_key(span.attributes, "http.target")
          - delete_key(span.attributes, "url.full")
          - delete_key(span.attributes, "url.query")
          - set(span.status.message, "")
      - context: spanevent
        statements:
          - delete_key(spanevent.attributes, "exception.message")
          - delete_key(spanevent.attributes, "exception.stacktrace")
  batch:
    timeout: 1s
    send_batch_size: 512
    send_batch_max_size: 1024
exporters:
  # Current Collector 0.160.0 names; older examples use otlp/otlphttp aliases.
  otlp_grpc/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
    timeout: 5s
    sending_queue:
      enabled: true
      queue_size: 1000
      storage: file_storage
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 10s
      max_elapsed_time: 300s
  otlp_http/loki:
    endpoint: http://loki:3100/otlp
    timeout: 5s
    sending_queue:
      enabled: true
      queue_size: 1000
      storage: file_storage
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 10s
      max_elapsed_time: 300s
service:
  extensions: [health_check, file_storage]
  telemetry:
    logs:
      level: info
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, transform/traces, batch]
      exporters: [otlp_grpc/tempo]
    logs:
      receivers: [fluent_forward]
      processors: [memory_limiter, resource/logs, transform/logs, batch]
      exporters: [otlp_http/loki]
